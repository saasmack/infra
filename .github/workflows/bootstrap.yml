name: Bootstrap (CI OIDC)

# Owns the GitHub OIDC provider and Terraform CI roles (envs/bootstrap, separate state).
# Plan on PR, apply on merge to main behind the dev approval gate.
# Intentionally has NO destroy action: tearing down envs/dev must never remove CI login.

on:
  push:
    branches: [main]
    paths:
      - 'envs/bootstrap/**'
      - 'modules/ci-oidc/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.15.6'
  AWS_REGION: us-east-1
  TF_VAR_github_repo_subject_prefixes: ${{ vars.GH_REPO_SUBJECTS }}

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Bootstrap Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: envs/bootstrap
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform validate -no-color
      - name: Test fresh-account bootstrap without AWS calls
        run: terraform test -no-color
      - run: terraform plan -no-color

  apply:
    name: Bootstrap Apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: dev
    defaults:
      run:
        working-directory: envs/bootstrap
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -auto-approve -no-color
