name: Bootstrap scripts

on:
  pull_request:
    paths: ["scripts/**", ".github/workflows/scripts-test.yml"]
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/scripts-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and GitHub settings setup
        run: |
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done
          bash scripts/tests/github_settings_test.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile and lint (syntax, undefined names, unused)
        run: |
          pip install ruff
          python -m py_compile scripts/*.py
          ruff check --select E9,F63,F7,F82,F401,F811,F841 scripts/
      - name: Test portable setup and credential-output safety
        run: python -m unittest discover -s scripts/tests -p '*_test.py'

  smoke:
    name: bootstrap smoke (01-03, kind)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: smoke
      - name: Run scripts 01-03 against kind
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          SKIP_ALB_CONTROLLER: "1"
          EXPECTED_KIND_CONTEXT: kind-smoke
          CLUSTER_NAME: smoke
          VPC_ID: vpc-00000000
          ALB_CONTROLLER_ROLE: arn:aws:iam::000000000000:role/test-alb
          GITOPS_PATH: ${{ runner.temp }}/gitops
          ENV: dev
          GITOPS_REPO_URL: https://github.com/example/gitops.git
          GITHUB_APP_ID: "1"
          GITHUB_APP_INSTALLATION_ID: "2"
          GITHUB_APP_KEY_PATH: ${{ runner.temp }}/app.pem
          AWS_ACCOUNT_ID: "000000000000"
          ESO_ROLE_NAME: test-eso
          RDS_MASTER_SECRET_ARN: arn:aws:secretsmanager:us-east-1:000000000000:secret:rds!db-test
        run: |
          mkdir -p "$RUNNER_TEMP/aws-kind-bin"
          cp scripts/tests/aws_kind_mock.sh "$RUNNER_TEMP/aws-kind-bin/aws"
          chmod +x "$RUNNER_TEMP/aws-kind-bin/aws"
          export PATH="$RUNNER_TEMP/aws-kind-bin:$PATH"
          mkdir -p "$GITOPS_PATH"
          openssl genrsa -out "$GITHUB_APP_KEY_PATH" 2048
          echo Y | python3 scripts/01_install_prerequisites.py
          echo Y | python3 scripts/02_bootstrap_argocd.py
          echo Y | python3 scripts/03_setup_external_secrets.py
      - name: Assert expected resources
        run: |
          set -e
          kubectl -n argocd rollout status deploy/argocd-server --timeout=120s
          kubectl -n external-secrets rollout status deploy/external-secrets --timeout=120s
          kubectl get ns dev
          kubectl -n argocd get secret gitops-repo
          test "$(kubectl -n argocd get secret gitops-repo -o jsonpath='{.metadata.labels.argocd\.argoproj\.io/secret-type}')" = repository
          kubectl -n argocd get appproject mackllc
          kubectl get clustersecretstore
          kubectl -n dev get externalsecret
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40

  app-layer:
    name: app layer (04-06, kind)
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops
          path: gitops
      - uses: helm/kind-action@v1
        with:
          cluster_name: apptest
      - name: Fake gh CLI (script 04 must not trigger real builds)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/gh" <<'EOF'
          #!/usr/bin/env bash
          echo "gh $*" >> "$RUNNER_TEMP/gh-calls.log"
          case "$1 $2" in
            "auth status") exit 0 ;;
            "workflow run") exit 0 ;;
            "run list") echo 12345 ;;
            "run view") echo "completed|success" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/gh"
      - name: Bootstrap cluster (01-03)
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          SKIP_ALB_CONTROLLER: "1"
          EXPECTED_KIND_CONTEXT: kind-apptest
          CLUSTER_NAME: apptest
          VPC_ID: vpc-00000000
          ALB_CONTROLLER_ROLE: arn:aws:iam::000000000000:role/test-alb
          GITOPS_PATH: ${{ github.workspace }}/gitops
          ENV: dev
          GITOPS_REPO_URL: https://github.com/${{ github.repository_owner }}/gitops.git
          GITHUB_APP_ID: "1"
          GITHUB_APP_INSTALLATION_ID: "2"
          GITHUB_APP_KEY_PATH: ${{ runner.temp }}/app.pem
          AWS_ACCOUNT_ID: "000000000000"
          ESO_ROLE_NAME: test-eso
          RDS_MASTER_SECRET_ARN: arn:aws:secretsmanager:us-east-1:000000000000:secret:rds!db-test
        run: |
          mkdir -p "$RUNNER_TEMP/aws-kind-bin"
          cp scripts/tests/aws_kind_mock.sh "$RUNNER_TEMP/aws-kind-bin/aws"
          chmod +x "$RUNNER_TEMP/aws-kind-bin/aws"
          export PATH="$RUNNER_TEMP/aws-kind-bin:$PATH"
          openssl genrsa -out "$GITHUB_APP_KEY_PATH" 2048
          echo Y | python3 scripts/01_install_prerequisites.py
          echo Y | python3 scripts/02_bootstrap_argocd.py
          echo Y | python3 scripts/03_setup_external_secrets.py
      - name: Script 04 (fake gh)
        env:
          PATH_PREFIX: ${{ runner.temp }}/fakebin
          GITHUB_ORG: ${{ github.repository_owner }}
          FRONTEND_REPO: frontend
          BACKEND_REPO: backend
          BRANCH: main
          POLL_INTERVAL: "1"
          MAX_WAIT: "30"
          TRIGGER_DELAY: "0"
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          printf 'A\nY\n' | python3 scripts/04_run_pipeline.py
          test "$(grep -c '^gh workflow run' "$RUNNER_TEMP/gh-calls.log")" = 9
      - name: Script 05 (apply Applications and report incomplete sync on kind)
        env:
          ENV: dev
          GITHUB_USERNAME: ${{ github.repository_owner }}
          AWS_ACCOUNT_ID: "111122223333"
          GITOPS_PATH: ${{ github.workspace }}/gitops
          POLL_INTERVAL: "5"
          MAX_WAIT: "20"
        run: |
          set +e
          printf 'A\nY\n' | python3 scripts/05_deploy_services.py
          rc=$?
          set -e
          echo "05 exit code: $rc"
          test "$rc" -eq 1
          test "$(kubectl -n argocd get applications --no-headers | wc -l)" = 9
      - name: Script 06 (must report failures - no images on kind)
        env:
          ENV: dev
          TIMEOUT_PODS: "10"
        run: |
          set +e
          python3 scripts/06_verify_deployment.py
          rc=$?
          echo "06 exit code: $rc"
          test "$rc" -ne 0
      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n argocd get applications
          kubectl get events -A --sort-by=.lastTimestamp | tail -40
